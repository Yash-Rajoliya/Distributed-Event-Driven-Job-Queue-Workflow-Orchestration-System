apiVersion: apps/v1
kind: Deployment
metadata:
  name: retry-orchestrator
  namespace: djqueue
spec:
  replicas: 2

  selector:
    matchLabels:
      app: retry-orchestrator

  template:
    metadata:
      labels:
        app: retry-orchestrator

    spec:
      containers:
        - name: retry
          image: YOUR_DOCKER_USER/retry-orchestrator:latest
          ports:
            - containerPort: 8083