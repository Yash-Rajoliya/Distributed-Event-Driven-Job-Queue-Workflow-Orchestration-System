version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  job-producer:
    build:
      context: ../../
      dockerfile: infrastructure/docker/services/job-producer.Dockerfile
    depends_on:
      - kafka
    ports:
      - "8081:8080"

  worker-service:
    build:
      context: ../../
      dockerfile: infrastructure/docker/services/worker-service.Dockerfile
    depends_on:
      - kafka
      - redis

  retry-orchestrator:
    build:
      context: ../../
      dockerfile: infrastructure/docker/services/retry-orchestrator.Dockerfile
    depends_on:
      - kafka

  dlq-processor:
    build:
      context: ../../
      dockerfile: infrastructure/docker/services/dlq-processor.Dockerfile
    depends_on:
      - kafka

  prometheus:
    image: prom/prometheus
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:2.2.0