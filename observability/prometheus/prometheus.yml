global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'job-producer'
    static_configs:
      - targets: ['job-producer:8081']

  - job_name: 'worker-service'
    static_configs:
      - targets: ['worker-service:8082']

  - job_name: 'retry-service'
    static_configs:
      - targets: ['retry-orchestrator:8083']