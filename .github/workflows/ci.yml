name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4[cite: 12]

      - name: Set up JDK
        uses: actions/setup-java@v4[cite: 12]
        with:
          distribution: 'temurin'[cite: 12]
          java-version: '17'[cite: 12]
          cache: 'maven'

      - name: Build project
        run: mvn clean install -DskipTests=false --batch-mode[cite: 12]
        env:
          MAVEN_OPTS: "-Dhttp.keepAlive=false -Dmaven.wagon.http.retryHandler.count=3"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USER != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}[cite: 12]
          password: ${{ secrets.DOCKER_PASS }}[cite: 12]

      - name: Build and Push Producer Image
        uses: docker/build-push-action@v5
        with:
          context: .[cite: 12]
          file: infrastructure/docker/services/job-producer.Dockerfile[cite: 12]
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USER != '' }}
          tags: ${{ secrets.DOCKER_USER || 'local' }}/job-producer:${{ github.sha }}[cite: 12]
          cache-from: type=gha,scope=job-producer
          cache-to: type=gha,mode=max,scope=job-producer

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .[cite: 12]
          file: infrastructure/docker/services/worker-service.Dockerfile[cite: 12]
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USER != '' }}
          tags: ${{ secrets.DOCKER_USER || 'local' }}/worker-service:${{ github.sha }}[cite: 12]
          cache-from: type=gha,scope=worker-service
          cache-to: type=gha,mode=max,scope=worker-service